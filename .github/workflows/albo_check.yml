name: Albo Pretorio Check

on:
  schedule:
    - cron: '57 6 * * *'
      timezone: Europe/Rome
    - cron: '37 12 * * *'
      timezone: Europe/Rome
    - cron: '17 18 * * *'
      timezone: Europe/Rome
    - cron: '7 0 * * *'
      timezone: Europe/Rome
    - cron: '37 3 * * *'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: albo-rocca-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STATE_GIT_BRANCH: main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
      - name: Assicura branch Git principale
        run: |
          git switch main
          git branch --set-upstream-to=origin/main main
      - name: Configura Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt
      - name: Test di regressione
        run: python -m unittest discover -s tests -v
      - name: Seleziona profilo
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'BOT_SECONDS=600' >> "$GITHUB_ENV"
            echo 'INTERVAL_MINUTES=15' >> "$GITHUB_ENV"
          elif [ "$SCHEDULE" = '7 0 * * *' ] || [ "$SCHEDULE" = '37 3 * * *' ]; then
            echo 'BOT_SECONDS=3300' >> "$GITHUB_ENV"
            echo 'INTERVAL_MINUTES=30' >> "$GITHUB_ENV"
          else
            echo 'BOT_SECONDS=20580' >> "$GITHUB_ENV"
            echo 'INTERVAL_MINUTES=15' >> "$GITHUB_ENV"
          fi
      - name: Esegui bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          set +e
          timeout --signal=INT --kill-after=120s "$BOT_SECONDS" python bot.py
          code=$?
          if [ "$code" -eq 124 ]; then
            echo 'Durata programmata raggiunta; arresto richiesto con SIGINT.'
            exit 0
          fi
          exit "$code"
      - name: Salva eventuale stato residuo
        if: always()
        run: |
          git config user.name AlboBot
          git config user.email bot@alborocca
          files=(data/seen_items.json data/seen_news.json data/subscribers.json data/subscribers_news.json data/user_seen.json data/user_seen_news.json data/last_check.txt data/telegram_updates.json data/albo_safety.json)
          existing=()
          for file in "${files[@]}"; do
            if [ -e "$file" ]; then existing+=("$file"); fi
          done
          if [ "${#existing[@]}" -gt 0 ]; then
            git add -- "${existing[@]}"
            if ! git diff --staged --quiet; then
              git commit -m 'aggiornamento database finale [skip ci]'
            fi
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
      - name: Conserva stato per recupero dopo errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state-recovery-${{ github.run_id }}
          path: |
            data/seen_items.json
            data/seen_news.json
            data/subscribers.json
            data/subscribers_news.json
            data/user_seen.json
            data/user_seen_news.json
            data/last_check.txt
            data/telegram_updates.json
            data/albo_safety.json
          retention-days: 3
