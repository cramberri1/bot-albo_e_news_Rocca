name: Albo Pretorio Recovery

on:
  workflow_run:
    workflows: [Albo Pretorio Check]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

# Serialize decisions; the bot keeps its separate single-writer concurrency.
concurrency:
  group: albo-rocca-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout codice affidabile da main
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Richiedi un solo worker di recupero se necessario
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 workflow_recovery.py recover
